<!DOCTYPE html>
<html>
<head>
<title>Sam's Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f7f7f7;
    font-family: sans-serif;
    position: relative;
  }

  #game-container {
    width: 100%;
    /* Default styles for desktop */
    max-width: 400px;
    height: 80vh;
    position: relative;
    border: 2px solid #000;
    overflow: hidden;
    /* Add background image */
    background-image: url('background.jpg');
    background-size: cover; /* Cover the entire container */
    background-repeat: no-repeat; /* Do not repeat the image */
    background-position: center; /* Center the image */
    background-color: #fff; /* Fallback color */
  }

  /* Media query for mobile screens (max-width 767px) */
  @media (max-width: 767px) {
    #game-container {
      width: 100%;
      max-width: none; /* Remove max-width for full mobile width */
      height: 100vh; /* Set height to 100% of viewport height */
      border: none; /* Optional: remove border in full screen */
    }
  }


  #start-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    text-align: center; /* Center text within the flex container */
    padding: 20px; /* Add some padding */
  }

  #game-title {
    font-size: 2em;
    font-weight: bold;
    margin-bottom: 20px; /* Space below the title */
    color: #333; /* Darker color for title */
  }

  #start-button {
    padding: 15px 30px;
    font-size: 24px;
    cursor: pointer;
    border: 2px solid #000;
    border-radius: 5px;
    background-color: #4CAF50;
    color: white;
    margin-bottom: 15px; /* Space below the button */
  }

  #tap-to-jump {
    font-size: 1.2em;
    color: #555; /* Slightly lighter color for instruction */
  }


  #game-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none; /* Hidden initially */
  }

  #header {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    z-index: 5;
    /* Changed header text color to white */
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5); /* Added text shadow for readability on potential light backgrounds */
  }

  #score {
    position: absolute;
    top: 40px;
    right: 10px;
    font-size: 1.1em;
    font-weight: bold;
    z-index: 5;
    /* Changed score text color to white */
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5); /* Added text shadow for readability */
  }

  #dino {
    position: absolute;
    /* Adjusted bottom position to be higher */
    bottom: 170px; /* Lowered by 60px (230 - 60) */
    /* Adjusted starting left position */
    left: 5px; /* Moved slightly more to the left */
    width: 120px; /* Sam's size */
    height: 120px; /* Sam's size */
    background-image: url('Sam.png');
    background-size: cover;
    z-index: 3;
    /* Ensure dino is displayed by default or when game starts */
    display: block;
  }

  .obstacle {
    position: absolute;
    /* Adjusted bottom position to be higher */
    bottom: 170px; /* Lowered by 60px (230 - 60) */
    width: 70px; /* Obstacle size */
    height: 70px; /* Obstacle size */
    background-size: cover;
    z-index: 2;
  }

  #peter {
      position: absolute;
      bottom: 170px; /* Lowered by 60px (230 - 60) */
      /* Made Peter 40% bigger than his current size (120x120 + 48x48 = 168x168) */
      width: 168px;
      height: 168px;
      background-image: url('Peter.png');
      background-size: cover;
      z-index: 4; /* Above dino */
      display: none; /* Hidden initially */
  }


  #game-over-screen, #win-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.9);
    display: none; /* Hidden initially */
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    text-align: center;
  }

  /* Style for the image on the win screen */
  #win-screen img {
    display: block; /* Make sure the image is displayed */
    width: 150px; /* Adjust size as needed */
    height: auto;
    margin-bottom: 20px; /* Space between image and message */
  }

   /* Style for the image on the game over screen */
  #game-over-screen img {
    display: block; /* Make sure the image is displayed */
    width: 150px; /* Adjust size as needed */
    height: auto;
    margin-bottom: 20px; /* Space between image and message */
  }


  .message {
    font-size: 1.5em;
    font-weight: bold;
    margin-bottom: 20px;
  }

  #play-again-button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border: 2px solid #000;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
    margin-top: 20px; /* Space below message */
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="start-screen">
    <div id="game-title">Sam's Hot Henry<br>Gauntlet</div> <div id="start-button">Play</div>
    <div id="tap-to-jump">Tap to Jump</div> </div>

  <div id="game-area">
    <div id="header">GET SAM TO THE ALTAR</div>
    <div id="score">Score: 0</div>
    <div id="dino"></div>
    <div id="peter"></div> </div>

  <div id="game-over-screen">
    <img src="peter2.png" alt="Peter"> <div class="message">oh no Sam left Peter for a Henry</div> <div id="play-again-button">Play Again?</div>
  </div>

  <div id="win-screen">
    <img src="sampete.png" alt="Sam and Peter"> <div class="message" id="win-message">yay they're married</div> <div id="play-again-button">Play Again?</div>
  </div>
</div>

<audio id="bg-music" src="bg.mp3" loop></audio>

<script>
  const gameContainer = document.getElementById('game-container');
  const startScreen = document.getElementById('start-screen');
  const startButton = document.getElementById('start-button');
  const gameArea = document.getElementById('game-area');
  const dino = document.getElementById('dino');
  const peter = document.getElementById('peter'); // Get Peter element for win animation
  const scoreDisplay = document.getElementById('score');
  const gameOverScreen = document.getElementById('game-over-screen'); // Corrected ID
  const winScreen = document.getElementById('win-screen');
  const winMessage = document.getElementById('win-message'); // Get win message element
  const playAgainButtons = document.querySelectorAll('#play-again-button');
  const bgMusic = document.getElementById('bg-music');

  // Adjusted ground level lower by 60px
  const groundLevel = 170; // Lowered by 60px (230 - 60)

  let dinoBottom = groundLevel;
  let gravity = 0.9;
  let velocityY = 0;
  let isJumping = false;
  let isGameOver = false;
  let isWinning = false; // State for win animation sequence
  let score = 0;
  let obstacleTimer; // For scheduling the next obstacle creation (now a timeout ID)
  let scoreTimer;
  let dinoBobbingTimer;
  // Removed gameLoopInterval - will use requestAnimationFrame for main loop

  let jumpsCount = 0; // Added jumps counter for double jump
  let isBobbingUp = false; // State variable for dino bobbing animation


  const obstacleTypes = ['OBS.png', 'obs2.png', 'obs3.png'];
  const minObstacleSpeed = 4.5; // Adjusted minimum speed
  const maxObstacleSpeed = 6; // Adjusted maximum speed
  // Increased minimum obstacle interval for better spacing
  const minObstacleInterval = 1500; // Increased from 1000
  const maxObstacleInterval = 2500; // Increased from 2000 (to keep a reasonable range)


  const winScoreThreshold = 200;

  let winAnimationId; // To store the requestAnimationFrame ID for the spinning animation
  let spinAngle = 0; // Current angle for spinning animation
  const spinRadius = 40; // Radius of the spinning circle (increased slightly)
  const spinSpeed = 0.02; // Speed of spinning (radians per frame) - decreased for slower spin
  const spinDuration = 4000; // Duration of the spinning animation in milliseconds (increased slightly)
  let spinStartTime = null; // Timestamp when spinning animation started

  // Hitbox offsets (pixels inwards from visual edge)
  const dinoHitboxOffsetLeft = 20;
  const dinoHitboxOffsetRight = 20; // Added offset for the right side
  const dinoHitboxOffsetTop = 20; // Added offset for the top side
  const dinoHitboxOffsetBottom = 20; // Added offset for the bottom side

   let animationFrameId; // To store the requestAnimationFrame ID for the main loop


  // Function to start the game
  function startGame() {
    console.log("startGame called");
    isGameOver = false; // Reset game over state
    isWinning = false; // Reset winning state
    score = 0;
    scoreDisplay.textContent = 'Score: 0';
    dinoBottom = groundLevel; // Use ground level
    dino.style.bottom = dinoBottom + 'px';
     // Adjusted starting left position in JavaScript
    dino.style.left = '5px'; // Moved slightly more to the left
    isJumping = false;
    velocityY = 0;
    jumpsCount = 0; // Reset jumps counter

    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none'; // Ensure game over screen is hidden
    winScreen.style.display = 'none'; // Ensure win screen is hidden
    gameArea.style.display = 'block';

    // Ensure dino is displayed at the start of a new game
    dino.style.display = 'block';
    // Ensure Peter is hidden at the start of a new game
    peter.style.display = 'none';


    // Clear any pending timers/animation frames
    clearInterval(scoreTimer);
    clearTimeout(obstacleTimer);
    clearInterval(dinoBobbingTimer);
    // Cancel previous animation frame if it exists
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    cancelAnimationFrame(winAnimationId);
    spinAngle = 0; // Reset spin angle
    spinStartTime = null; // Reset spin start time
    isBobbingUp = false; // Reset bobbing state


    // Remove any existing obstacles
    const obstacles = document.querySelectorAll('.obstacle');
    obstacles.forEach(obstacle => obstacle.remove());

    bgMusic.currentTime = 0; // Rewind music
    bgMusic.play();

    scoreTimer = setInterval(() => {
      if (isGameOver || isWinning) return; // Don't increase score if game over or winning
      score += 10;
      scoreDisplay.textContent = 'Score: ' + score;

      // Check win condition
      if (score >= winScoreThreshold && !isWinning) { // Check win condition only once
        console.log("Win condition met (score). Setting isWinning = true.");
        isWinning = true; // Set winning state immediately
        clearInterval(scoreTimer); // Stop the score timer
        clearTimeout(obstacleTimer); // Clear the timeout for the next obstacle creation
        // Allow gameLoop to continue for landing if mid-air
      }
    }, 1000);

    // Start generating obstacles with random intervals initially
    scheduleCreateObstacle();

    // Start the dino bobbing animation timer
    dinoBobbingTimer = setInterval(dinoBob, 500);

    // Start the main game loop using requestAnimationFrame
    animationFrameId = requestAnimationFrame(gameLoop);
  }

  // Schedule the creation of the next regular obstacle with a random delay
  function scheduleCreateObstacle() {
      if (isGameOver || isWinning) return; // Don't schedule if game over or winning
      const randomInterval = Math.random() * (maxObstacleInterval - minObstacleInterval) + minObstacleInterval;
      obstacleTimer = setTimeout(createObstacle, randomInterval);
  }


  // Dino bobbing animation
  function dinoBob() {
      // Bobbing animation should be relative to the ground level
      const bobAmount = 5; // Pixels to bob up
      // Only bob if not jumping, game over, or winning
      if (!isJumping && !isGameOver && !isWinning) {
          console.log("Dino bobbing logic entered. isBobbingUp:", isBobbingUp);
          if (isBobbingUp) {
              dino.style.bottom = groundLevel + 'px';
              isBobbingUp = false;
          } else {
              dino.style.bottom = (groundLevel + bobAmount) + 'px';
              isBobbingUp = true;
          }
      } else if (isGameOver || isWinning) { // If game over or winning, ensure on ground level and reset bobbing state
         dino.style.bottom = groundLevel + 'px';
         isBobbingUp = false;
      }
      // No need for an else case here to set to groundLevel, the interval handles repeated calls
      // and the other conditions ensure it's set to groundLevel when needed.
  }


  // Function for dino jump
  function jump() {
    // Allow jump if less than 2 jumps performed and not game over or winning
    if (jumpsCount < 2 && !isGameOver && !isWinning) {
      isJumping = true;
      velocityY = 20; // Apply upward velocity for the jump
      jumpsCount++; // Increment jump counter
      console.log("Jump performed. jumpsCount:", jumpsCount); // Log jumps
    }
  }

  // Function to create a regular obstacle
  function createObstacle() {
    if (isGameOver || isWinning) return; // Don't create if game over or winning

    const obstacle = document.createElement('div');
    obstacle.classList.add('obstacle');
    const randomObstacle = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
    obstacle.style.backgroundImage = `url('${randomObstacle}')`;
    const gameAreaWidth = gameArea.offsetWidth;
    obstacle.style.left = gameAreaWidth + 'px';
    gameArea.appendChild(obstacle);

    let obstacleLeft = gameAreaWidth;
    // Assign a random speed to this specific obstacle
    const currentObstacleSpeed = Math.random() * (maxObstacleSpeed - minObstacleSpeed) + minObstacleSpeed;


    function moveObstacle() {
      if (isGameOver || isWinning) { // Stop moving if game over or winning
        return;
      }

      obstacleLeft -= currentObstacleSpeed; // Use the assigned random speed
      obstacle.style.left = obstacleLeft + 'px';

      // Remove obstacle when it goes off screen
      if (obstacleLeft + obstacle.offsetWidth < 0) {
        obstacle.remove();
      } else {
         requestAnimationFrame(moveObstacle);
      }
    }

    moveObstacle();
    // Schedule the next regular obstacle after this one starts
    scheduleCreateObstacle();
  }


  // Collision detection
  function checkCollision() {
    if (isGameOver || isWinning) return; // No collision detection if game over or winning

    const dinoRect = dino.getBoundingClientRect();
    const obstacles = document.querySelectorAll('.obstacle'); // Only check regular obstacles

    obstacles.forEach(obstacle => {
      const obstacleRect = obstacle.getBoundingClientRect();

      // Apply hitbox offsets to Sam's bounding rectangle for the collision check
      const dinoHitboxLeft = dinoRect.left + dinoHitboxOffsetLeft;
      const dinoHitboxRight = dinoRect.right - dinoHitboxOffsetRight;
      const dinoHitboxTop = dinoRect.top + dinoHitboxOffsetTop;
      const dinoHitboxBottom = dinoRect.bottom - dinoHitboxOffsetBottom;


      if (
        dinoHitboxLeft < obstacleRect.right &&
        dinoHitboxRight > obstacleRect.left &&
        dinoHitboxTop < obstacleRect.bottom &&
        dinoHitboxBottom > obstacleRect.top
      ) {
        // Collision with a regular obstacle - GAME OVER!
        console.log("Collision with regular obstacle. GAME OVER!");
        gameOver(); // Call the game over function
        // Stop checking collisions after the first one
        return;
      }
    });
  }

  // Game over function (for hitting regular obstacles)
  function gameOver() {
    if (isGameOver) return;
    console.log("gameOver called (regular obstacle).");
    isGameOver = true;
    bgMusic.pause();
    clearInterval(scoreTimer);
    clearTimeout(obstacleTimer); // Clear the timeout for the next obstacle
    clearInterval(dinoBobbingTimer); // Stop the bobbing timer
    // Cancel the main game loop animation frame
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    cancelAnimationFrame(winAnimationId); // Cancel any ongoing win animation

    // Remove all obstacles
    const obstacles = document.querySelectorAll('.obstacle');
    obstacles.forEach(obstacle => obstacle.remove());

    gameOverScreen.style.display = 'flex';
    gameArea.style.display = 'none';
  }

  // Function to play the spinning win animation
  function playSpinningWinAnimation(timestamp) {
    if (isGameOver) { // Allow game over to interrupt winning animation
        cancelAnimationFrame(winAnimationId);
        peter.style.display = 'none'; // Hide Peter if game over
        dino.style.display = 'none'; // Hide Dino if game over
        return;
    }

    if (!spinStartTime) {
        spinStartTime = timestamp;
        console.log("Spinning animation started.");
         // Remove obstacles as soon as spinning starts
        const obstacles = document.querySelectorAll('.obstacle');
        obstacles.forEach(obstacle => obstacle.remove());

         // Ensure Sam and Peter are displayed for the animation
        dino.style.display = 'block';
        peter.style.display = 'block';
    }

    const elapsed = timestamp - spinStartTime;
    const animationComplete = elapsed >= spinDuration;

    if (!animationComplete) {
        spinAngle = (elapsed / spinDuration) * (Math.PI * 2 * 2); // Spin 2 full circles over duration
        // You can also use a constant speed: spinAngle += spinSpeed;

        // Calculate center point for spinning - middle of the game area (vertically)
        const centerX = gameArea.offsetWidth / 2;
        // Kept centerY calculation in the middle of the game area height
        const centerY = gameArea.offsetHeight / 2;

        // Calculate new positions based on angle, radius, and center
        // Adjusting for element's own size to center them on the point
        const dinoSpinLeft = centerX + spinRadius * Math.cos(spinAngle) - (dino.offsetWidth / 2);
        const dinoSpinBottom = centerY + spinRadius * Math.sin(spinAngle) - (dino.offsetHeight / 2);

        const peterSpinLeft = centerX + spinRadius * Math.cos(spinAngle + Math.PI) - (peter.offsetWidth / 2); // +PI for opposite side
        const peterSpinBottom = centerY + spinRadius * Math.sin(spinAngle + Math.PI) - (peter.offsetHeight / 2);


        // Update CSS positions
        dino.style.left = dinoSpinLeft + 'px';
        dino.style.bottom = dinoSpinBottom + 'px';
        peter.style.left = peterSpinLeft + 'px';
        peter.style.bottom = peterSpinBottom + 'px';

        winAnimationId = requestAnimationFrame(playSpinningWinAnimation); // Request next frame
    } else {
        // Animation is complete
        console.log("Spinning animation complete. Showing win screen.");
        cancelAnimationFrame(winAnimationId);

        // Position them in a final pose at the end at the new ground level
         dino.style.left = (gameArea.offsetWidth / 2) - (dino.offsetWidth / 2) + 'px'; // Center horizontally
         dino.style.bottom = groundLevel + 'px'; // Position at the new ground level
         peter.style.left = (gameArea.offsetWidth / 2) + (peter.offsetWidth / 2) + 'px'; // Place Peter next to Sam
         peter.style.bottom = groundLevel + 'px'; // Position at the new ground level


        // The win message is static in the HTML now
        // winMessage.textContent = 'yay they\'re married';

        // Display the win screen after a short moment
        setTimeout(() => {
            gameArea.style.display = 'none';
            winScreen.style.display = 'flex';
             // Hide Peter and Dino once game area is hidden
            dino.style.display = 'none';
            peter.style.display = 'none';
        }, 500); // Delay in milliseconds (adjust as needed)
    }
  }


  // Main game loop - handles gravity and updates position, checks collision
  // Now driven by requestAnimationFrame
  function gameLoop(timestamp) {
    // console.log("Game loop started, isGameOver:", isGameOver, "isWinning:", isWinning, "dinoBottom:", dinoBottom); // Uncomment for detailed logging

    if (isGameOver) { // Stop game loop entirely if game over (regular)
        console.log("Game loop stopping due to isGameOver.");
        return; // Animation frame will not request next frame
    }

    // --- Update Physics and Game State ---

    if (isJumping) { // Apply gravity if jumping
      dinoBottom += velocityY;
      velocityY -= gravity; // Apply gravity

      // Check if hit ground (using groundLevel variable)
      if (dinoBottom <= groundLevel) {
        dinoBottom = groundLevel;
        isJumping = false;
        velocityY = 0; // Reset velocity
        jumpsCount = 0; // Reset jumps counter on landing
        console.log("Dino landed. jumpsCount reset."); // Log landing
      }
    }
    dino.style.bottom = dinoBottom + 'px';


    // If winning and dino has landed, start the spinning animation
    if (isWinning && !isJumping && dinoBottom <= groundLevel) { // Use groundLevel variable
        console.log("Dino landed during winning state. Starting spinning win animation.");
        // Stop the main game loop by not requesting the next frame here
        // The spinning animation loop will take over
        playSpinningWinAnimation(timestamp); // Pass timestamp to animation
        return; // Stop this game loop iteration
    }


    // Only check collisions if NOT winning
    if (!isWinning) {
        checkCollision();
    }
    // Obstacle movement is handled by their individual move functions
    // and stops automatically when isWinning or isGameOver is true.


    // --- Request Next Frame ---
    // console.log("Game loop finished frame, requesting next."); // Uncomment for detailed logging
    animationFrameId = requestAnimationFrame(gameLoop); // Request the next frame
  }

  // Event listeners
  startButton.addEventListener('click', startGame);

  // Use a single event listener on the game container for jumps,
  // ignoring events that originate from buttons.
  gameContainer.addEventListener('touchstart', (event) => {
      // Check if the touch started on a button
      if (event.target.closest('#start-button, #play-again-button')) {
          console.log("Touch started on a button, ignoring jump.");
          return; // If it's a button, let the button's click event handle it
      }
      // Prevent default touch behavior like scrolling or zooming
      event.preventDefault();
      console.log("Game container touched, attempting jump.");
      jump();
  }, { passive: false }); // passive: false is important to allow preventDefault

  // Also add a click event for easier testing on desktop browsers
  gameContainer.addEventListener('click', (event) => {
       // Check if the click target is not one of the buttons
       if (!event.target.closest('#start-button, #play-again-button')) {
           console.log("Game container clicked, attempting jump.");
           jump();
       } else {
           console.log("Click target is a button, letting button handler take over.");
       }
  });


  // Add event listeners to all "Play Again?" buttons using event delegation or direct attachment
  playAgainButtons.forEach(button => {
    button.addEventListener('click', startGame);
  });


</script>

</body>
</html>
